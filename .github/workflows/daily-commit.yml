name: LeetCode Daily Commit

on:
  schedule:
    # Runs daily at 2:30 PM IST (09:00 UTC)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  commit-daily-challenge:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to allow pushing commits back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run LeetCode fetcher script
        run: python scripts/fetch_daily.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit (LeetCode problem already updated for today)."
          else
            git commit -m "Automated Daily LeetCode: $(date +'%Y-%m-%d')"
            git push
          fi
